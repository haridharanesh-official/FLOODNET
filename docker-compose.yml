services:
  postgres:
    image: postgres:17-alpine
    container_name: floodnet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floodnet}
      POSTGRES_USER: ${POSTGRES_USER:-floodnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floodnet_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - floodnet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floodnet} -d ${POSTGRES_DB:-floodnet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: floodnet-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  core:
    build:
      context: ./floodnet-core
    container_name: floodnet-core
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://floodnet:floodnet_dev_password@postgres:5432/floodnet}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./floodnet-web
    container_name: floodnet-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/live}
    ports:
      - "3000:3000"
    depends_on:
      - core

volumes:
  floodnet_pgdata:
